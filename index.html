<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/bamboo.css" type="text/css">
    <title>Dashboard</title>
    <link rel="icon" href="img/favicon.ico">
    <link rel="stylesheet" href="css/styles.css">

</head>
<body>
    <header>
        <nav>
            <img src="img/name_logo.png" alt="Tiendamon">
            <ul>
                <a href="index.html">
                    <li>Ver</li>
                </a>
                <a href="consultar.html">
                    <li>Consultar id</li>
                </a>
                <a href="crear.html">
                    <li>Crear</li>
                </a>
                <a href="modificar.html">
                    <li>Modificar</li>
                </a>
                <a href="eliminar.html">
                    <li>Eliminar</li>
                </a>
            </ul>
        </nav>
    </header>

    <div class="classcard-producto"></div>
    <main>
        <h1>Lista de productos</h1>
        <hr>
        <div id="contenedor-productos"></div>
    </main>

    <script>
        // Seleccionamos el elemento al que le vamos a inyectar el HTML

        let contenedorProductos = document.getElementById("contenedor-productos");
        const url = "http://localhost:3000/productos"
        
        async function obtenerProductos()
        {
            try{
                let respuesta =  await fetch(url)

                let data = await respuesta.json();

                let productos = data.payload;

                mostrarProductos(productos);

            }
            catch(error){
                console.log(error);
            }
        }
        function mostrarProductos(array)
        {
            console.table(array); //recibimos correctamente en formate tabla los productos q nos manda la funcion obtenerPorductos()

            let htmlProducto ="";

            array.forEach(producto=> {
                htmlProducto += `
                    <div class= "card-producto">
                        <img src="${producto.img}" alt="${producto.nombre}"  width="150" height="150">
                        <h3>${producto.nombre}<h4>
                        <p>Id:${producto.id}</p>
                        <p>$${producto.precio}</p>
                    </div>
                `;

            });
            contenedorProductos.innerHTML = htmlProducto;
        }

        function init() {
            obtenerProductos();
        }

        init();
    </script>
</body>
</html>
