    <div class="classcard-producto"></div>
    <main>
        <h1>Lista de productos</h1>
        <hr>
        <div id="contenedor-productos"></div>
    </main>


    <script>
        // Seleccionamos el elemento al que le vamos a inyectar el HTML

        let contenedorProductos = document.getElementById("contenedor-productos");
        const url = "http://localhost:3000/products"
        
        async function obtenerProductos()
        {
            try{
                let respuesta =  await fetch(url) //// Hacemos una petición a nuestro nuevo endpoint en http://localhost:3000/products

                let data = await respuesta.json();

                console.log(data); //nuestros productos estan disponibles de payload  { payload: Array(5) }

                let productos = data.payload //// Acá guardamos en la variable productos el array de productos que contiene "payload"


                /*
                {
                    "id": 1,
                    "nombre": "prod1",
                    "precio": 2000,
                    "tipo": "",
                    "img_url": "https://unsplash.com/es/s/fotos/img",
                    "activo": 0
                    },
                    {
                    "id": 2,
                    "nombre": "prod2",
                    "precio": 200,
                    "tipo": "CATEGORIA_2",
                    "img_url": "https://stanleypm.vtexassets.com/arquivos/ids/159696-150-auto?v=638755909297270000&width=150&height=auto&aspect=true",
                    "activo": 0
                    },

                */
                // console.table(productos);

                mostrarProductos(productos);

            }
            catch(error){
                console.log(error)
            }
        }
        function mostrarProductos(array)
        {
            console.table(array); //recibimos correctamente en formate tabla los productos q nos manda la funcion obtenerPorductos()

            let htmlProducto ="";

            array.forEach(producto=> {
                htmlProducto += `
                    <div class= "card-producto">
                        <img src="${producto.img}" alt="${producto.nombre}"  width="150" height="150">
                        <h3>Nombre: ${producto.nombre}<h4>
                        <p>Id:${producto.id}</p>
                        <p>precio: $${producto.precio}</p>
                    </div>
                `;

            });
            contenedorProductos.innerHTML = htmlProducto;
            console.log(htmlProducto);
        }


        function init() {
            obtenerProductos();
            
        }

        init();
    </script>
