<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/bamboo.css" type="text/css">
    <title>Tiendamon</title>
    <link rel="icon" href="img/favicon.ico">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html"><img src="img/name_logo.png" alt="Tiendamon"></a>
            <ul>
                <a href="index.html">
                    <li>Inicio</li>
                </a>
                <a href="consultar.html">
                    <li>Consultar id</li>
                </a>
                <a href="crear.html">
                    <li>Crear</li>
                </a>
                <a href="modificar.html">
                    <li>Modificar</li>
                </a>
                <a href="eliminar.html">
                    <li>Eliminar</li>
                </a>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Consultar producto por id:</h1>

        <form id="getProductos-form" class="products-form">

            <label for="idProd">Id del producto</label>
            <input type="number" name="id" id="idProd" required>

            <input class="button" type="submit" value="Consultar producto">
        </form>

        <hr>
        <div id="listado-productos">
        </div>
    </main>

    <script>
        let getProducts_form = document.getElementById("getProductos-form");
        let listado_productos = document.getElementById("listado-productos");


        getProducts_form.addEventListener("submit", async (event) => {
            
            event.preventDefault(); 

            let formData = new FormData(event.target);

            let data = Object.fromEntries(formData.entries());

            let idProducto = data.id;

            try {
                // Hago el fetch a la url personalizada
                let response = await fetch(`http://localhost:3000/api/productos/${idProducto}`);
                console.log(response);

                // Proceso los datos que me devuelve el servidor
                let datos = await response.json();
                console.log(datos);

                // Extraigo el producto que devuelve payload
                let producto = datos.payload[0]; // Apuntamos a la respuesta, vamos a payload que trae el array con el objeto y extraemos el primer y unico elemento

                // Le pasamos el producto a una funcion que lo renderice en la pantalla
                mostrarProducto(producto); 

            } catch (error) {
                console.error("Error: ", error);
            }

        });

        function mostrarProducto(producto) {
            console.table(producto); // El producto se recibe correctamente

            let htmlProducto = `
                <ul class="card-producto">
                    <li><img src="${producto.img}" alt="${producto.nombre}" class="img-listados"></li>
                    <li>Id: ${producto.id}</li>
                    <li>Nombre: ${producto.nombre}</li>
                    <li><strong>Precio: $${producto.precio}</strong></li>
                </ul>
                `;

            listado_productos.innerHTML = htmlProducto;
        }
    </script>
    
</body>
</html>
