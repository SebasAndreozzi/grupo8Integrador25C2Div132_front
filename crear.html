<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="img/favicon.ico">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
        <header>
        <nav>
            <a href="index.html"><img src="img/name_logo.png" alt="Tiendamon"></a>
            <ul>
                <a href="index.html">
                    <li>Inicio</li>
                </a>
                <a href="consultar.html">
                    <li>Consultar id</li>
                </a>
                <a href="crear.html">
                    <li>Crear</li>
                </a>
                <a href="modificar.html">
                    <li>Modificar</li>
                </a>
                <a href="eliminar.html">
                    <li>Eliminar</li>
                </a>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Crear producto</h1>
        <form id="altaProducto-form" class="productos-form">
            <label for="nameProd">Nombre: </label>
            <input id="nameProd" name="name" type="text" required>

            <label for="priceProd">Precio: </label>
            <input id="priceProd" name="price" type="number" required>

            <label for="categoryProd">Categoría: </label>
            <select id="categoryProd" name="category" required>
                <option value="Sellado">Sellado</option>
                <option value="Accesorio">Accesorio</option>
            </select>

            <label for="imgProd">Imágen: </label>
            <input id="imgProd" name="img" type="text" required>

            <input class="button" type="submit" value="Crear Producto">
        </form>

        <hr>
        <div id="contenedor-productos"></div>
    </main>

    <script>
        let altaProducto_form = document.getElementById("altaProducto-form");

        altaProducto_form.addEventListener("submit", async event => {
           
        event.preventDefault();

        let formData = new FormData(event.target);

        let data = Object.fromEntries(formData.entries());

        console.log(JSON.stringify(data));

        enviarProducto(data);
        })

        async function enviarProducto(data){
            let url = "http://localhost:3000/api/productos"
            try{
                let response = await fetch(url, {
                    method: "POST",
                    headers: {
                        "Content-type": "application/json"
                    },
                    body: JSON.stringify(data)
                })

                let result = await response.json();

                if(response.ok){
                    console.log(result.message);
                    alert(result.message);
                }
                else{
                    console.error(result.message);
                    alert("Error")
                }

            }catch(err){
                console.log("Error: ", err)
            }
        }
    </script>
</body>
